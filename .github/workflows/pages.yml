# Build the game and publish it to GitHub Pages on every push to main.
#
# The game is a Vite app (apps/game) that depends on the design system
# (packages/ui) through its built dist/, so the library is built first. Tier 1
# runs in between: a deploy never ships a build whose unit tests or type
# checks failed. The E2E suite (Playwright, Chromium) is not run here -- it
# takes three minutes and needs a browser install -- and stays the local gate
# after every stage, as .claude/CHECKPOINT.md records.
#
# One-time setup, by hand: in the repository's Settings > Pages, set the
# source to "GitHub Actions". Until then this workflow builds but the deploy
# step is refused. See .claude/DECISIONS.md DEC-008.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes a queued one but never
# cancels a deploy already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Build the design system, then check and test both workspaces
        run: |
          npm run build -w @kart-republique/ui
          npm run typecheck
          npm run test
      - name: Build the game
        run: npm run build -w @kart-republique/game
        # The remote game server for team races (DEC-015), from the
        # KR_SERVER_URL repository variable. Unset: the page stays solo.
        env:
          VITE_KR_SERVER: ${{ vars.KR_SERVER_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/game/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
