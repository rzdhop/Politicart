# Fly.io configuration for the game server (team races online).
#
#   fly launch --no-deploy --copy-config   # pick your own app name and region
#   fly deploy
#   fly scale count 1                      # rooms live in memory: run exactly one machine
#
# Accounts are kept in /data/politikart-accounts.json, on the volume mounted below:
#   fly volumes create kr_data --size 1     # once, in the app's region
# (or set a DATABASE_URL secret to keep them in Postgres instead).
#
# The app name below is a placeholder; `fly launch` replaces it with yours.
app = "politikart"
# Paris: the players are in France. The Neon database is in Frankfurt (Neon
# has no Paris region), about 10 ms away.
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  HOST = "0.0.0.0"

[mounts]
  source = "kr_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Stop the machine when nobody is connected; the first visitor wakes it.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/kr"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
