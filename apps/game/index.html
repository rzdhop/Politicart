<meta charset="utf-8">
<!-- Declared explicitly: the original single file relied on the server
     sending charset=utf-8, which GitHub Pages does and Vite's preview
     server does not. Without it Chrome falls back to a locale default and
     every accented character in the French copy renders as mojibake. -->
<title>Kart République</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- The look comes from @kart-republique/ui, imported by src/game.js, which also
     self-hosts the two web fonts the original fetched from Google Fonts. The
     two rules that belong to the game shell rather than the design system
     (the canvas and the select screen's layout override) are in src/game.css. -->

<canvas id="c"></canvas>

<!-- The six screens, the HUD and the note banner are React, mounted here from
     src/ui. They render the same element ids the single-file game had
     (DEC-009); the HUD is drawn once and then driven through imperative
     handles from src/game.js, never through React state. -->
<div id="ui"></div>

<script type="module" src="/src/game.js"></script>
