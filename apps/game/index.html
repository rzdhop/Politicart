<meta charset="utf-8">
<!-- Declared explicitly: the original single file relied on the server
     sending charset=utf-8, which GitHub Pages does and Vite's preview
     server does not. Without it Chrome falls back to a locale default and
     every accented character in the French copy renders as mojibake. -->
<title>Politikart</title>
<!-- Phones: lay the page out at the device's width (not a zoomed-out desktop
     page), reach under the notch and the home bar (the HUD keeps clear of them
     with env(safe-area-inset-*)), and never zoom: a double tap on a touch
     button must not zoom the race. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c1230">
<meta name="claude:viewport-fit-sides" content="cover">
<!-- The icon: a gold P on the night panel over the tricolore (public/, which
     Vite copies to the build's root). Relative hrefs, like the build's own
     assets (base './'), so they resolve both at / and under /Politicart/.
     The SVG first; the PNG for browsers without SVG icons; favicon.ico
     answers the bare /favicon.ico request browsers make on their own. -->
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<!-- The look comes from @politikart/ui, imported by src/game.js, which also
     self-hosts the two web fonts the original fetched from Google Fonts. The
     two rules that belong to the game shell rather than the design system
     (the canvas and the select screen's layout override) are in src/game.css. -->

<canvas id="c"></canvas>

<!-- The six screens, the HUD and the note banner are React, mounted here from
     src/ui. They render the same element ids the single-file game had
     (DEC-009); the HUD is drawn once and then driven through imperative
     handles from src/game.js, never through React state. -->
<div id="ui"></div>

<script type="module" src="/src/game.js"></script>
