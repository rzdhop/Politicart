# Render Blueprint for the game server (team races online, free tier).
#
#   Render dashboard > New > Blueprint > pick this repository > Apply
#
# It builds the repository's Dockerfile. Rooms live in memory, so it runs
# exactly one instance. The free plan sleeps after 15 minutes with nobody
# connected: the next visitor waits about a minute while it wakes, and a race
# in progress when it falls asleep is lost. Render sets PORT itself.
services:
  - type: web
    name: politikart
    runtime: docker
    plan: free
    # The players are in France. Render has no Paris region; Frankfurt is the
    # nearest (about 10 ms away) and holds the Neon database too.
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/kr
    numInstances: 1
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      # Render's free disk is wiped whenever the service sleeps, so accounts
      # need a database: paste the pooled URL of the Neon project Politikart
      # (aws-eu-central-1, Frankfurt, next to this service). Left empty,
      # accounts vanish on every restart.
      - key: DATABASE_URL
        sync: false
      # The admin account (it alone edits the cast) and its password hash,
      # made with `npm run -s admin-hash -w @politikart/server`. Left
      # empty, nobody is admin and the Workshop stays off.
      - key: POLITIKART_ADMIN_USER
        value: rida
      - key: POLITIKART_ADMIN_PASSWORD_HASH
        sync: false
